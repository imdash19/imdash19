# ══════════════════════════════════════════════════════════════════
#  Snake Animation Generator — GitHub Actions Workflow
#  File: .github/workflows/snake.yml
#
#  What this does:
#    1. Runs every day at midnight UTC (cron schedule)
#    2. Also runs whenever you push to the main branch
#    3. Also runs manually from the Actions tab (workflow_dispatch)
#    4. Reads your GitHub contribution grid
#    5. Generates two SVG snake animations:
#         - Light mode  → github-contribution-grid-snake.svg
#         - Dark mode   → github-contribution-grid-snake-dark.svg
#    6. Pushes both SVGs to the `output` branch of this repo
#    7. The README.md pulls the SVGs from that branch automatically
# ══════════════════════════════════════════════════════════════════

name: Generate Snake Animation

on:
  # ── Run once every day at midnight UTC ──────────────────────────
  schedule:
    - cron: "0 0 * * *"

  # ── Run whenever you push to main (or master) ───────────────────
  push:
    branches:
      - main
      - master

  # ── Run manually from the GitHub Actions tab ────────────────────
  workflow_dispatch:

jobs:
  generate-snake:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest

    # Grant write access so the action can push to the output branch
    permissions:
      contents: write

    steps:
      # ── Step 1: Check out the repository ────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Generate the snake SVG files ────────────────────
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ── Step 3: Push the SVGs to the `output` branch ────────────
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate contribution snake [skip ci]"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
